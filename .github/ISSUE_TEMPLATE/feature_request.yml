name: Feature request
description: Propose a focused improvement that is ready for issue tracking
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        For broad ideas, new skill concepts, or design exploration, prefer GitHub Discussions under Ideas first.
  - type: textarea
    id: need
    attributes:
      label: Problem or need
      description: What user, contributor, or operator problem should this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior, skill, documentation, validation, or workflow change you want.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and affected components
      description: Identify likely skills, files, or workflows and what should remain out of scope.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note workarounds or different designs you considered.
  - type: textarea
    id: verification
    attributes:
      label: Acceptance criteria
      description: How should maintainers verify that the request is complete and correct?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions for similar requests.
          required: true
        - label: The request fits the repository's Minecraft skill-pack scope.
          required: true
